<body>
<header class="top"><div class="logo">N</div><div><div class="brand">NEXUS</div><div class="sub">INTERACTIVE WORKSHOP</div></div><div class="spacer"></div><button id="save">Save layout</button><button id="reset">Reset</button></header>

let placed=[],selected=null,category='All',cam={yaw:-.65,pitch:.55,zoom:1,targetX:0,targetY:0},mode='move',exploded=false,drag=null,pointers=new Map(),lastPinch=0;

function uid(){return 'p'+Math.random().toString(36).slice(2,9)}
function add(def,position){const p={id:uid(),def, x:position?.x??(Math.random()-.5)*1.8,y:position?.y??0,z:position?.z??(Math.random()-.5)*1.8,rot:0,scale:1,offset:null};placed.push(p);select(p);draw();toast(def[1]+' added');}
function select(p){selected=p;$('#inspector').classList.toggle('show',!!p);if(p){$('#iName').textContent=p.def[1];$('#iDesc').textContent=p.def[2]+' · Illustrative 3D model; verify exact part datasheet for engineering use.';['x','y','z'].forEach(k=>$('#p'+k).value=p[k].toFixed(2));}draw()}
function updatePos(){if(!selected)return;['x','y','z'].forEach(k=>{const v=parseFloat($('#p'+k).value);if(Number.isFinite(v))selected[k]=Math.max(-8,Math.min(8,v))});draw()}
function renderCats(){ $('#cats').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=category===c?'active':'';b.onclick=()=>{category=c;renderCats();renderParts()};$('#cats').append(b)})}

function renderParts(){const term=$('#search').value.toLowerCase();const list=defs.filter(d=>(category==='All'||d[0]===category)&&d[1].toLowerCase().includes(term));$('#parts').innerHTML='';if(!list.length){$('#parts').innerHTML='<div class="empty">No components match that search.</div>';return}list.forEach(d=>{const b=document.createElement('button');b.className='part';b.innerHTML=`<div class="thumb"><span class="shape" style="font-size:${['led','ledg'].includes(d[3])?'36':'28'}px;color:${d[3]==='led'?'#d63b38':d[3]==='ledg'?'#26975b':d[3]==='board'?'#167d68':'#526575'}">${thumb(d[3])}</span></div><b>${d[1]}</b><small>${d[0]} · ${d[2]}</small><span class="add">＋ ADD TO WORKBENCH</span>`;b.onclick=()=>add(d);$('#parts').append(b)})}
function resize(){const r=$('#scene').getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function project(x,y,z){const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);const xx=x*cy-z*sy, zz=x*sy+z*cy, yy=y*cp-zz*sp, depth=y*sp+zz*cp;const scale=Math.min(canvas.clientWidth,canvas.clientHeight)*.105*cam.zoom;return {x:canvas.clientWidth*.5+(xx-cam.targetX)*scale,y:canvas.clientHeight*.53-(yy-cam.targetY)*scale,depth,scale}}
function poly(points,fill,stroke='#52616a'){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function line(a,b,color,width=1,localColor,localWidth){ctx.beginPath();if(typeof a==='number'){ctx.moveTo(a,b);ctx.lineTo(color,width);ctx.strokeStyle=localColor||'#87969c';ctx.lineWidth=localWidth||1}else{ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color||'#87969c';ctx.lineWidth=width||1}ctx.stroke()}

const colors=['#248c78','#176a5e','#0f5149'];ctx.save();ctx.translate(q.x,q.y);ctx.rotate(p.rot);
const sc=q.scale*.68*s;ctx.scale(sc,sc);ctx.lineWidth=1/sc;

if(type==='board'||type==='sensor'||type==='sensor2'){rect(type==='board'?2.9:1.7,type==='board'?1.8:1.1,type==='board'?'#167b68':'#247c8a','#0b504b',.12);for(let i=0;i<14;i++){ctx.fillStyle='#d9b45c';ctx.fillRect(-1.35+i*.2,-.96,.09,.12);ctx.fillRect(-1.35+i*.2,.84,.09,.12)}rect(.8,.65,'#202c32','#6b8588',.04);ctx.fillStyle='#d6e4dd';ctx.font='.14px sans-serif';ctx.fillText(type==='board'?'UNO R3':'SENSOR',-.35,.05);for(let i=0;i<5;i++){ctx.fillStyle='#d8d9d2';ctx.fillRect(-.7+i*.3,-.55,.12,.12)}}

else if(type==='motor'||type==='servo'||type==='stepper'){rect(1.15,.75,type==='servo'?'#286eae':'#9aa4a6','#58676b',.12);rect(.42,.58,'#bcc4c4','#657276',.04);ctx.fillStyle='#c6a35d';ctx.fillRect(.48,-.08,.5,.16);ctx.fillStyle='#353e42';ctx.fillRect(-.35,-.28,.14,.14);ctx.fillRect(-.1,-.28,.14,.14)}

else if(type==='bolt'||type==='nut'||type==='terminal'){rect(.65,.4,type==='terminal'?'#b3b7b0':'#8f9a9c','#526169',.05);ctx.fillStyle='#e3e5df';ctx.beginPath();ctx.arc(0,0,.12,0,Math.PI*2);ctx.fill()}
else if(type==='display'){rect(1.1,.8,'#20292b','#59666b',.05);ctx.fillStyle='#f05b50';ctx.font='bold .5px monospace';ctx.fillText('8',-.17,.17)}
else {rect(1.2,.75,['plate','piston','linkage','hinge'].includes(type)?'#9aa6a8':'#c2c9c5','#647279',.08);ctx.fillStyle='#e5e9e4';ctx.beginPath();ctx.arc(0,0,.13,0,Math.PI*2);ctx.fill()}
if(selected===p){ctx.strokeStyle='#168bc0';ctx.lineWidth=.035;ctx.setLineDash([.1,.06]);ctx.strokeRect(-1.7,-1.15,3.4,2.3);ctx.setLineDash([])}
ctx.restore();p._screen={x:q.x,y:q.y,r:Math.max(20,Math.min(55,sc*1.8))};}
function draw(){if(!ctx)return;const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h); // ground grid in projected coordinates
ctx.save();ctx.strokeStyle='#d0d3cc';ctx.lineWidth=1;for(let i=-8;i<=8;i++){line(project(i,-.55,-8),project(i,-.55,8),'#d3d6cf');line(project(-8,-.55,i),project(8,-.55,i),'#d3d6cf')}ctx.restore();
const origin=project(0,-.5,0);line(origin,project(2,-.5,0),'#d64a48',2);line(origin,project(0,1.7,0),'#299452',2);line(origin,project(0,-.5,2),'#267bd0',2);
if(!placed.length){ctx.save();ctx.fillStyle='#8b9691';ctx.textAlign='center';ctx.font='600 14px system-ui';ctx.fillText('Your workbench is empty',w/2,h/2-12);ctx.font='12px system-ui';ctx.fillText('Tap “＋ Component library” to add individual parts',w/2,h/2+12);ctx.restore()}
[...placed].sort((a,b)=>project(a.x,a.y,a.z).depth-project(b.x,b.y,b.z).depth).forEach(drawPart);$('#count').textContent=placed.length+' component'+(placed.length===1?'':'s');}
function openLib(){ $('#library').classList.add('show');renderCats();renderParts()}
function closeLib(){ $('#library').classList.remove('show')}
function reset(){placed=[];selected=null;exploded=false;$('#inspector').classList.remove('show');cam={yaw:-.65,pitch:.55,zoom:1,targetX:0,targetY:0};draw();toast('Workbench reset')}
function dup(){if(selected){const p={...selected,id:uid(),x:selected.x+.5,z:selected.z+.4,offset:null};placed.push(p);select(p);toast('Component duplicated')}else toast('Select a component first')}
function remove(){if(!selected){toast('Select a component first');return}placed=placed.filter(p=>p!==selected);selected=null;$('#inspector').classList.remove('show');draw();toast('Component removed')}
$('#openLib').onclick=openLib;$('#closeLib').onclick=closeLib;$('#search').oninput=renderParts;$('#save').onclick=()=>{try{localStorage.setItem('nexus-layout-v1',JSON.stringify(placed.map(p=>({id:p.id,def:p.def,x:p.x,y:p.y,z:p.z,rot:p.rot,scale:p.scale}))));toast('Layout saved on this device')}catch(e){toast('Could not save layout')}};$('#reset').onclick=reset;$('#home').onclick=()=>{cam={yaw:-.65,pitch:.55,zoom:1,targetX:0,targetY:0};draw()};$('#zin').onclick=()=>{cam.zoom=Math.min(3.5,cam.zoom*1.18);draw()};$('#zout').onclick=()=>{cam.zoom=Math.max(.35,cam.zoom/1.18);draw()};$('#duplicate').onclick=$('#duplicateBottom').onclick=dup;$('#remove').onclick=$('#removeBottom').onclick=remove;$('#deselect').onclick=()=>select(null);
['x','y','z'].forEach(k=>$('#p'+k).addEventListener('change',updatePos));
$('#modeMove').onclick=()=>setMode('move');$('#modeRotate').onclick=()=>setMode('rotate');$('#modeScale').onclick=()=>setMode('scale');
function setMode(m){mode=m;['Move','Rotate','Scale'].forEach(n=>$('#mode'+n).classList.toggle('active',m===n.toLowerCase()));toast('Tool: '+m)}
$('#explode').onclick=()=>{exploded=!exploded;placed.forEach((p,i)=>{if(exploded){p.offset={x:(p.x||0)*.35+Math.cos(i*2)*.3,y:.2+(i%3)*.12,z:(p.z||0)*.35+Math.sin(i*2)*.3}}else p.offset=null});draw();toast(exploded?'Exploded view':'Exploded view closed')};$('#reassemble').onclick=()=>{exploded=false;placed.forEach(p=>p.offset=null);draw();toast('Components reassembled')};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;const map={xp:[0,0],xn:[Math.PI,0],yp:[0,Math.PI/2-.01],yn:[0,-Math.PI/2+.01],zp:[Math.PI/2,0],zn:[-Math.PI/2,0]};cam.yaw=map[v][0];cam.pitch=Math.max(-1.35,Math.min(1.35,map[v][1]));draw();toast('View '+v.toUpperCase())});
let pts=new Map(),lastSingle=null,lastMid=null,lastDist=0,gestureMoved=false,dragTarget=null;
function hitTest(clientX,clientY){const r=canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;let hit=null,best=Infinity;placed.forEach(p=>{if(!p._screen)return;const d=Math.hypot(x-p._screen.x,y-p._screen.y);if(d<p._screen.r&&d<best){hit=p;best=d}});return hit}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});gestureMoved=false;if(pts.size===1){lastSingle={x:e.clientX,y:e.clientY};dragTarget=hitTest(e.clientX,e.clientY);if(dragTarget&&dragTarget===selected)drag={x:e.clientX,y:e.clientY}}if(pts.size===2){dragTarget=null;drag=null;const a=[...pts.values()];lastMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
canvas.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1&&lastSingle){const dx=e.clientX-lastSingle.x,dy=e.clientY-lastSingle.y;if(Math.abs(dx)+Math.abs(dy)>2)gestureMoved=true;if(dragTarget&&dragTarget===selected){if(mode==='move'){selected.x+=dx/(canvas.clientWidth*.1*cam.zoom);selected.z+=dy/(canvas.clientHeight*.1*cam.zoom)}else if(mode==='rotate'){selected.rot=(selected.rot||0)+dx*.01}else if(mode==='scale'){selected.scale=Math.max(.25,Math.min(3,selected.scale+dx*.005))}}else{cam.yaw+=dx*.008;cam.pitch=Math.max(-1.4,Math.min(1.4,cam.pitch+dy*.006))}lastSingle={x:e.clientX,y:e.clientY};draw()}else if(pts.size>=2){const a=[...pts.values()],mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist>0&&dist>0){cam.zoom=Math.max(.35,Math.min(3.5,cam.zoom*dist/lastDist));cam.targetX-=(mid.x-lastMid.x)/(canvas.clientWidth*.1*cam.zoom);cam.targetY+=(mid.y-lastMid.y)/(canvas.clientHeight*.1*cam.zoom)}lastDist=dist;lastMid=mid;gestureMoved=true;draw()}});
canvas.addEventListener('pointerup',e=>{if(!gestureMoved&&pts.size===1){const hit=hitTest(e.clientX,e.clientY);if(hit)select(hit);else select(null)}pts.delete(e.pointerId);lastSingle=null;drag=null;dragTarget=null;if(pts.size<2){lastMid=null;lastDist=0}});canvas.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);lastSingle=null;lastDist=0});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.35,Math.min(3.5,cam.zoom*(e.deltaY<0?1.1:.9)));draw()},{passive:false});
try{const saved=JSON.parse(localStorage.getItem('nexus-layout-v1')||'[]');saved.forEach(o=>{const d=defs.find(d=>d[1]===o.def?.[1])||o.def;if(d)placed.push({...o,def:d,offset:null})});if(placed.length)toast('Previous layout restored')}catch(e){}
if(!placed.length){[['Arduino UNO R3',-2,0,0],['Solderless breadboard',1.3,0,0],['Red LED 5 mm',0,0,1.8],['Resistor 220 Ω',0,0,2.8],['Jumper wire',-0.2,0,3.6]].forEach(([name,x,y,z])=>{const d=defs.find(d=>d[1]===name);if(d)placed.push({id:uid(),def:d,x,y,z,rot:0,scale:1,offset:null})})}
renderCats();renderParts();window.addEventListener('resize',resize);resize();$('#status').textContent='Ready · library has '+defs.length+' individual component types. Tap the library to add parts.';
})();
</script></body></html>
